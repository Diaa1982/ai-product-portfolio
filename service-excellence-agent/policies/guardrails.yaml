  identify_data_quality_issues: autonomous
  create_dashboard_specification: autonomous
  create_management_report_draft: autonomous
  create_process_map_draft: autonomous
  propose_corrective_actions: autonomous
  request_agent_work: autonomous
  propose_automation: autonomous

  change_official_kpi_definition: require_approval
  change_official_kpi_target: require_approval
  publish_official_executive_results: require_approval
  write_salesforce_or_crm: require_approval
  change_customer_commitment: require_approval
