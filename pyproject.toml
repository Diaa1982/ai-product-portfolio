[project]
name = "ai-product-portfolio"
version = "0.1.0"
description = "Governed AI product portfolio for PFM and enterprise operations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pypdf>=5.0,<7.0",
  "reportlab>=4.2,<5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
