services:
  signal-detector:
    build:
      context: ../../..
      dockerfile: products/signal-detection-agent/deploy/Dockerfile
    ports: ["${P04_PORT:-8080}:8080"]
    environment:
      CASE_STORE_PATH: /app/data/runtime/cases.json
      P04_CONFIG_PATH: /app/products/signal-detection-agent/config/detection.v1.json
    volumes: ["p04-runtime:/app/data/runtime"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
volumes:
  p04-runtime:
