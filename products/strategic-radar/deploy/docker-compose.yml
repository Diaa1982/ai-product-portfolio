services:
  strategic-radar:
    build:
      context: ../../..
      dockerfile: products/strategic-radar/deploy/Dockerfile
    ports: ["${P03_PORT:-8080}:8080"]
    environment:
      CASE_STORE_PATH: /app/data/runtime/cases.json
      P03_CONFIG_PATH: /app/products/strategic-radar/config/radar.v1.json
    volumes: ["p03-runtime:/app/data/runtime"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
volumes:
  p03-runtime:
