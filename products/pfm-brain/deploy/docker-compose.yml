services:
  pfm-brain:
    build:
      context: ../../..
      dockerfile: products/pfm-brain/deploy/Dockerfile
    ports:
      - "${PFM_BRAIN_PORT:-8080}:8080"
    environment:
      P02_CONFIG_PATH: /app/products/pfm-brain/config/pfm-brain.v1.json
      CASE_STORE_PATH: /app/data/runtime/cases.json
    read_only: true
    tmpfs:
      - /tmp
      - /app/data/runtime
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
