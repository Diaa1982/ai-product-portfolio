services:
  control-tower:
    build:
      context: ../../..
      dockerfile: products/ai-governance-control-tower/deploy/Dockerfile
    ports: ["${P14_PORT:-8080}:8080"]
    environment:
      CASE_STORE_PATH: /app/data/runtime/cases.json
      P14_CONFIG_PATH: /app/products/ai-governance-control-tower/config/governance.v1.json
    volumes: ["p14-runtime:/app/data/runtime"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
volumes:
  p14-runtime:
