services:
  p08-assessor:
    build:
      context: ../../..
      dockerfile: products/ai-use-case-assessor/deploy/Dockerfile
    ports:
      - "${P08_PORT:-8080}:8080"
    environment:
      CASE_STORE_PATH: /app/data/runtime/cases.json
      P08_CONFIG_PATH: /app/products/ai-use-case-assessor/config/scoring.v1.json
    volumes:
      - p08-runtime:/app/data/runtime
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  p08-runtime:
