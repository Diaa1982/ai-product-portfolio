services:
  revenue-reconciliation-ai:
    build:
      context: ../../..
      dockerfile: products/revenue-reconciliation-ai/deploy/Dockerfile
    ports:
      - "${REVENUE_RECON_PORT:-8080}:8080"
    environment:
      P12_CONFIG_PATH: /app/products/revenue-reconciliation-ai/config/reconciliation.v1.json
      CASE_STORE_PATH: /app/data/runtime/cases.json
    read_only: true
    tmpfs:
      - /tmp
      - /app/data/runtime
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
