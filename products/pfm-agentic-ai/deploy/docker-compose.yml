services:
  pfm-agentic-ai:
    build:
      context: ../../..
      dockerfile: products/pfm-agentic-ai/deploy/Dockerfile
    ports:
      - "${PFM_PORT:-8080}:8080"
    environment:
      P01_CONFIG_PATH: /app/products/pfm-agentic-ai/config/pfm-agents.v1.json
      CASE_STORE_PATH: /app/data/runtime/cases.json
    read_only: true
    tmpfs:
      - /tmp
      - /app/data/runtime
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
