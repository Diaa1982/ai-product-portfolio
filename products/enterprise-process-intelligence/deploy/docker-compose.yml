services:
  p10:
    build: {context: ../../.., dockerfile: products/enterprise-process-intelligence/deploy/Dockerfile}
    ports: ["${P10_PORT:-8080}:8080"]
    environment: {P10_CONFIG_PATH: /app/products/enterprise-process-intelligence/config/process-intelligence.v1.json, CASE_STORE_PATH: /app/data/runtime/cases.json}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: [p10-runtime:/app/data/runtime]
volumes: {p10-runtime: {}}
