          curl --fail --silent --header "Content-Type: application/json" \
            --data @products/partnership-management-copilot/synthetic/complete-partnership.json \
            http://127.0.0.1:8080/p07/analyze |
            python -c "import json,sys; r=json.load(sys.stdin); assert r['claim_evidence_assessments'][0]['assessed_status']=='Realized'; assert r['utilization']['utilization_percent']==100; assert r['notification_draft']['send_permitted'] is False; assert len(r['audit_digest'])==64"
          curl --fail --silent --header "Content-Type: application/json" \
            --data '{"action":"terminate agreement"}' \
            http://127.0.0.1:8080/p07/actions/check |
            python -c "import json,sys; r=json.load(sys.stdin); assert r['permitted'] is False; assert r['human_authority_required'] is True"

      - name: Build P10 deployment image
