            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/p01 >/dev/null
          curl --fail --silent --header "Content-Type: application/json" \
            --data @products/pfm-agentic-ai/synthetic/pfm-case.json \
            http://127.0.0.1:8080/p01/analyze |
            python -c "import json,sys; r=json.load(sys.stdin); assert r['available_balance']==450; assert r['liquidity_gap']==50; assert r['handoff_status']=='READY'"
          curl --fail --silent --header "Content-Type: application/json" \
            --data '{"action":"authorize payment"}' \
            http://127.0.0.1:8080/p01/actions/check |
            python -c "import json,sys; r=json.load(sys.stdin); assert r['decision']=='DENY_AUTONOMOUS_EXECUTION'; assert r['human_authority_required'] is True"

      - name: Build P02 deployment image
        run: docker build -f products/pfm-brain/deploy/Dockerfile -t p02-pfm-brain:ci .
      - name: Smoke-test P02 governed fiscal intelligence API
        shell: bash
        run: |
          docker run -d --name p02-pfm-brain-ci -p 8080:8080 p02-pfm-brain:ci
          trap 'docker logs p02-pfm-brain-ci; docker rm -f p02-pfm-brain-ci' EXIT
