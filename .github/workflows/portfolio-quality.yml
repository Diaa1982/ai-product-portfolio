        run: docker build -f products/partnership-management-copilot/deploy/Dockerfile -t p07-partnership:ci .
      - name: Smoke-test P07 evidence, utilization and protected legal actions
        shell: bash
        run: |
          docker run -d --name p07-partnership-ci -p 8080:8080 p07-partnership:ci
          trap 'docker logs p07-partnership-ci; docker rm -f p07-partnership-ci' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 1
