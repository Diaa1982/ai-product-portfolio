            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/p12 >/dev/null
          curl --fail --silent --header "Content-Type: application/json" \
            --data @products/revenue-reconciliation-ai/synthetic/reconciled-form-601.json \
            http://127.0.0.1:8080/p12/reconcile |
            python -c "import json,sys; r=json.load(sys.stdin); assert r['calculations']['settlement_amount']==850; assert r['calculations']['total_invoice']==105; assert r['calculations']['net_transfer']==745; assert r['match_status']=='MATCHED'; assert r['decision_status']=='RECONCILED_FOR_HUMAN_CONFIRMATION'"
          curl --fail --silent --header "Content-Type: application/json" \
            --data '{"action":"approve refund"}' \
            http://127.0.0.1:8080/p12/actions/check |
            python -c "import json,sys; r=json.load(sys.stdin); assert r['decision']=='DENY_AUTONOMOUS_EXECUTION'; assert r['human_authority_required'] is True"

      - name: Build P05 deployment image
