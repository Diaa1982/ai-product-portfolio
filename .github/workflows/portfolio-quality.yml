          curl --fail --silent --header "Content-Type: application/json" \
            --data @products/service-design-ai/synthetic/complete-g2g-service.json \
            http://127.0.0.1:8080/p05/design |
            python -c "import json,sys; r=json.load(sys.stdin); assert r['service_classification']=='G2G'; assert len(r['journey'])==5; assert len(r['blueprint'])==6; assert r['deliverable_control']['controlled_total']==54; assert r['gate_evaluation']['status']=='READY_FOR_RECORDED_DECISION'"
          curl --fail --silent --header "Content-Type: application/json" \
            --data '{"action":"launch service"}' \
            http://127.0.0.1:8080/p05/actions/check |
            python -c "import json,sys; r=json.load(sys.stdin); assert r['permitted'] is False; assert r['human_approval_required'] is True"

      - name: Build P06 deployment image
        run: docker build -f products/process-audit-ai/deploy/Dockerfile -t p06-process-audit:ci .
      - name: Smoke-test P06 evidence, scoring, dashboard and protected assurance actions
