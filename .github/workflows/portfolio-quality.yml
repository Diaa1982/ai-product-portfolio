name: Portfolio Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate product registry
        run: python scripts/validate_portfolio.py
      - name: Run unit and control tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src scripts tests
      - name: Reject common secret files
        shell: bash
        run: |
          if find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" \) | grep -q .; then
            echo "Potential secret file committed."
            exit 1
          fi
      - name: Build P08 deployment image
        run: docker build -f products/ai-use-case-assessor/deploy/Dockerfile -t p08-assessor:ci .
      - name: Smoke-test P08 health, interface and assessment API
        shell: bash
        run: |
          docker run -d --name p08-assessor-ci -p 8080:8080 p08-assessor:ci
          trap 'docker logs p08-assessor-ci; docker rm -f p08-assessor-ci' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/health >/dev/null
          curl --fail --silent http://127.0.0.1:8080/p08 >/dev/null
          curl --fail --silent --header "Content-Type: application/json" \
            --data @products/ai-use-case-assessor/synthetic/complete-assessment.json \
            http://127.0.0.1:8080/p08/assess |
            python -c "import json,sys; r=json.load(sys.stdin); assert r['portfolio_classification']=='Quick Win'; assert r['required_gate']=='PRIORITIZATION'"
      - name: Build P03 deployment image
        run: docker build -f products/strategic-radar/deploy/Dockerfile -t p03-radar:ci .
      - name: Smoke-test P03 evidence and materiality API
        shell: bash
        run: |
          docker run -d --name p03-radar-ci -p 8080:8080 p03-radar:ci
          trap 'docker logs p03-radar-ci; docker rm -f p03-radar-ci' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/p03 >/dev/null
          curl --fail --silent --header "Content-Type: application/json" \
            --data @products/strategic-radar/synthetic/verified-signal.json \
            http://127.0.0.1:8080/p03/signals/assess |
            python -c "import json,sys; r=json.load(sys.stdin); assert r['evidence_status']=='verified'; assert r['materiality_route']=='auto_alert_eligible'"
      - name: Build P04 deployment image
        run: docker build -f products/signal-detection-agent/deploy/Dockerfile -t p04-detector:ci .
      - name: Smoke-test P04 governed detection API
        shell: bash
        run: |
          docker run -d --name p04-detector-ci -p 8080:8080 p04-detector:ci
          trap 'docker logs p04-detector-ci; docker rm -f p04-detector-ci' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/p04 >/dev/null
          curl --fail --silent --header "Content-Type: application/json" \
            --data @products/signal-detection-agent/synthetic/verified-change.json \
            http://127.0.0.1:8080/p04/detect |
            python -c "import json,sys; r=json.load(sys.stdin); assert r['evidence_status']=='verified'; assert r['review_route']=='priority_analyst_review'; assert r['publication_status']=='not_published_analyst_review_required'"
      - name: Build P14 deployment image
        run: docker build -f products/ai-governance-control-tower/deploy/Dockerfile -t p14-control-tower:ci .
      - name: Smoke-test P14 risk and incident controls
        shell: bash
        run: |
          docker run -d --name p14-control-tower-ci -p 8080:8080 p14-control-tower:ci
          trap 'docker logs p14-control-tower-ci; docker rm -f p14-control-tower-ci' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/p14 >/dev/null
          curl --fail --silent --header "Content-Type: application/json" \
            --data @products/ai-governance-control-tower/synthetic/low-risk-profile.json \
            http://127.0.0.1:8080/p14/risk/classify |
            python -c "import json,sys; r=json.load(sys.stdin); assert r['risk_tier']=='Low'; assert r['deployment_blocked'] is False"
          curl --fail --silent --header "Content-Type: application/json" \
            --data @products/ai-governance-control-tower/synthetic/critical-monitoring-event.json \
            http://127.0.0.1:8080/p14/monitor |
            python -c "import json,sys; r=json.load(sys.stdin); assert r['severity']=='Critical'; assert r['required_action']=='safe_shutdown_and_incident_command'"
      - name: Build P09 deployment image
        run: docker build -f products/corporate-performance-review-ai/deploy/Dockerfile -t p09-performance:ci .
      - name: Smoke-test P09 governed KPI review API
        shell: bash
        run: |
          docker run -d --name p09-performance-ci -p 8080:8080 p09-performance:ci
          trap 'docker logs p09-performance-ci; docker rm -f p09-performance-ci' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/p09 >/dev/null
          curl --fail --silent --header "Content-Type: application/json" \
            --data @products/corporate-performance-review-ai/synthetic/kpi-review.json \
            http://127.0.0.1:8080/p09/review |
            python -c "import json,sys; r=json.load(sys.stdin); assert r['data_quality_status']=='Valid'; assert r['performance_status']=='Exceeded'; assert r['proposed_target_status']=='Not Proposed'"

      - name: Build P01 deployment image
        run: docker build -f products/pfm-agentic-ai/deploy/Dockerfile -t p01-pfm-agentic:ci .
      - name: Smoke-test P01 controlled PFM orchestration API
        shell: bash
        run: |
          docker run -d --name p01-pfm-agentic-ci -p 8080:8080 p01-pfm-agentic:ci
          trap 'docker logs p01-pfm-agentic-ci; docker rm -f p01-pfm-agentic-ci' EXIT
          for attempt in {1..20}; do
